<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede9ff" />
    <meta
      name="description"
      content="TACO: TActile World Model as a Self-COrrector for Scalable VLA Post-Training. A tactile-aware world-model-driven framework for scalable VLA post-training."
    />
    <title>TACO: TActile World Model as a Self-COrrector</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0f172a',
                purple: '#8b5cf6',
                cyan: '#06b6d4',
              }
            },
            fontFamily: {
              sans: ['"Google Sans"', '"Noto Sans"', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
    <style>
      /* ── Page base ── */
      body {
        background: #e8e2ff;
        min-height: 100vh;
      }

      /* ── Holographic cellophane overlay (fixed behind all content) ── */
      #holo-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          /* Pink-magenta diagonal band — lower-left */
          linear-gradient(132deg,
            rgba(255, 110, 180, 0.26) 0%,
            rgba(255, 148, 210, 0.16) 18%,
            transparent 40%),
          /* Sky-cyan band — center */
          linear-gradient(157deg,
            transparent 14%,
            rgba(80, 205, 255, 0.24) 34%,
            rgba(135, 230, 255, 0.14) 52%,
            transparent 70%),
          /* Gold/amber streak */
          linear-gradient(108deg,
            transparent 28%,
            rgba(255, 208, 110, 0.22) 48%,
            rgba(255, 228, 145, 0.11) 64%,
            transparent 80%),
          /* Teal-mint band — lower-right */
          linear-gradient(145deg,
            transparent 50%,
            rgba(72, 228, 218, 0.20) 64%,
            rgba(105, 240, 235, 0.10) 78%,
            transparent 93%),
          /* Violet blob — top-left */
          linear-gradient(175deg,
            rgba(195, 140, 255, 0.25) 0%,
            rgba(178, 130, 255, 0.14) 22%,
            transparent 42%),
          /* Secondary peach-pink band */
          linear-gradient(120deg,
            transparent 36%,
            rgba(255, 155, 195, 0.16) 54%,
            rgba(255, 175, 215, 0.08) 68%,
            transparent 84%),
          /* Upper-right cyan shimmer */
          linear-gradient(140deg,
            transparent 58%,
            rgba(115, 220, 255, 0.13) 72%,
            transparent 88%),
          /* Base iridescent pastel */
          linear-gradient(150deg,
            #f5f0ff 0%, #eef7ff 24%, #fff6fd 48%, #f0fffd 72%, #f7f0ff 100%);
        animation: holoBreath 9s ease-in-out infinite;
      }
      @keyframes holoBreath {
        0%, 100% { opacity: 0.72; }
        50%       { opacity: 0.92; }
      }

      /* ── Decorative taco images inside holo-bg ── */
      #holo-bg {
        overflow: hidden;  /* prevent taco images from causing scrollbars */
      }
      .holo-taco {
        position: absolute;
        pointer-events: none;
        user-select: none;
        mix-blend-mode: multiply;
      }

      /* ── Content layer above the holo background ── */
      #root {
        position: relative;
        z-index: 1;
      }

      /* ── Deep glassmorphism card — cellophane feel ── */
      .glass-card {
        position: relative;
        background: rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(24px) saturate(190%) brightness(105%);
        -webkit-backdrop-filter: blur(24px) saturate(190%) brightness(105%);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        box-shadow:
          /* Outer soft purple glow */
          0 8px 48px rgba(150, 90, 255, 0.08),
          /* Top inner highlight */
          inset 0  2px 0 rgba(255, 255, 255, 0.50),
          /* Bottom inner — subtle violet tint */
          inset 0 -1.5px 0 rgba(195, 160, 255, 0.18),
          /* Left inner — cyan tint */
          inset  2px 0 0 rgba(110, 215, 255, 0.14),
          /* Right inner — pink tint */
          inset -2px 0 0 rgba(255, 145, 215, 0.14);
        border-radius: 1.25rem;
        overflow: hidden;
      }

      /* Rainbow sheen overlay on glass cards */
      .glass-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(
          118deg,
          rgba(255, 160, 200, 0.10) 0%,
          rgba(200, 230, 255, 0.10) 25%,
          rgba(180, 255, 240, 0.08) 50%,
          rgba(255, 230, 160, 0.08) 75%,
          rgba(220, 160, 255, 0.10) 100%
        );
        background-size: 250% 250%;
        animation: sheenMove 7s ease-in-out infinite;
        mix-blend-mode: overlay;
      }
      @keyframes sheenMove {
        0%   { background-position: 0%   50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0%   50%; }
      }

      /* ── Click-to-spawn taco particles ── */
      @keyframes tacoJump {
        0%   { transform: translate(-50%, -50%) scale(1)   rotate(0deg);   opacity: 1; }
        35%  { transform: translate(-50%, -110%) scale(1.3) rotate(-15deg); opacity: 1; }
        100% { transform: translate(-50%, -200%) scale(0.4) rotate(20deg);  opacity: 0; }
      }
      .taco-pop {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        width: 60px;
        height: auto;
        user-select: none;
        animation: tacoJump 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }

      /* ── Arrow animations ── */
      @keyframes drawArrow {
        0%   { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowPulse {
        0%, 100% {
          filter: drop-shadow(0 0 3px rgba(139, 92, 246, 0.55));
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(139, 92, 246, 1))
                  drop-shadow(0 0 24px rgba(6, 182, 212, 0.65));
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-Bz5xQ4Y4.js"></script>
  </head>
  <body class="text-gray-900 antialiased">
    <div id="holo-bg" aria-hidden="true">
      <!-- Pink kawaii taco — large, bottom-left, spills off edge -->
      <img
        src="/assets/design/pink_taco.png"
        alt=""
        class="holo-taco"
        loading="lazy"
        style="bottom:-18%; left:-10%; width:52vw; max-width:560px; opacity:0.12; filter:blur(20px) saturate(0.60); transform:rotate(-18deg);"
      />
      <!-- Yellow kawaii taco — top-right corner -->
      <img
        src="/assets/design/yellow_taco.png"
        alt=""
        class="holo-taco"
        loading="lazy"
        style="top:-12%; right:-10%; width:44vw; max-width:480px; opacity:0.10; filter:blur(18px) saturate(0.60); transform:rotate(14deg);"
      />
      <!-- White-bg taco — mid-right, most blurred / deepest -->
      <img
        src="/assets/design/taco_whiteBG.png"
        alt=""
        class="holo-taco"
        loading="lazy"
        style="top:42%; right:-4%; width:28vw; max-width:320px; opacity:0.08; filter:blur(26px); transform:rotate(22deg);"
      />
    </div>
    <div id="root"></div>
</body>
</html>
